# One-click Hostinger deploy downloads this file and builds it from Git.
# A local clone uses docker-compose.override.yml, which builds this directory instead.

services:
  quorum:
    build:
      context: https://github.com/vijaysuper11/quordiscuss.git#main
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      TRUST_PROXY: "1"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      BOARD_NAME: ${BOARD_NAME:-QuorDiscuss}
      BOARD_TAGLINE: ${BOARD_TAGLINE:-What should we build next?}
      BOARD_DESCRIPTION: ${BOARD_DESCRIPTION:-Suggest ideas, vote, and follow what ships.}
      # APP_URL: https://feedback.example.com
      # PROJECT_URL: https://github.com/vijaysuper11/quordiscuss
    volumes:
      - quorum_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  quorum_data:
